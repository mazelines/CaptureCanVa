name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'
      timezone: Asia/Seoul

permissions:
  contents: read

env:
  PROJECT: src/CaptureCanva/CaptureCanva.csproj
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NUGET_PACKAGES: ${{ github.workspace }}/.cache/nuget
  FFMPEG_CACHE_DIRECTORY: ${{ github.workspace }}/.cache/ffmpeg

jobs:
  build:
    name: Build (Debug + Release)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        id: nuget-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('**/*.csproj', '**/NuGet.Config', '**/nuget.config', 'global.json') }}

      - name: Restore
        # Warm the runtime packages used by self-contained win-x64 releases too.
        run: dotnet restore CaptureCanva.slnx -r win-x64 -p:SelfContained=true

      - name: Build Debug
        run: dotnet build CaptureCanva.slnx -c Debug --no-restore -warnaserror

      - name: Build Release
        run: dotnet build CaptureCanva.slnx -c Release --no-restore -warnaserror

      - name: Cache FFmpeg
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ env.FFMPEG_CACHE_DIRECTORY }}
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-v1-${{ hashFiles('scripts/Bundle-Ffmpeg.ps1') }}

      - name: Verify account and upload flows offline
        run: dotnet run --project tests/CaptureCanva.UploadChecks/CaptureCanva.UploadChecks.csproj -c Release --no-build

      - name: Verify hidden Drive WPF paths
        run: dotnet run --project tests/CaptureCanva.UIChecks/CaptureCanva.UIChecks.csproj -c Release --no-build

      - name: Verify cached FFmpeg
        shell: pwsh
        run: ./scripts/Bundle-Ffmpeg.ps1 -OutputDirectory "$env:RUNNER_TEMP/CaptureCanva-daily-check" -CacheDirectory $env:FFMPEG_CACHE_DIRECTORY

      - name: Verify GIF conversion and cancellation
        shell: pwsh
        run: dotnet run --project tests/CaptureCanva.GifChecks/CaptureCanva.GifChecks.csproj -c Release --no-build -- "$env:RUNNER_TEMP/CaptureCanva-daily-check/ffmpeg.exe"

      - name: Summarize daily cache check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          NUGET_CACHE_HIT: ${{ steps.nuget-cache.outputs.cache-hit }}
          FFMPEG_CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
        run: |
          $nugetStatus = if ($env:NUGET_CACHE_HIT -eq 'true') { 'Reused' } else { 'Prepared for saving after job success' }
          $ffmpegStatus = if ($env:FFMPEG_CACHE_HIT -eq 'true') { 'Reused' } else { 'Prepared for saving after job success' }
          @"
          ## Daily build and cache check

          - Schedule: every day at 03:00 Asia/Seoul
          - NuGet cache: $nugetStatus
          - FFmpeg cache: $ffmpegStatus
          - Debug and Release builds: passed
          - FFmpeg SHA-256 and H.264/AAC encoding: passed
          - GIF presets, decoding, cancellation, and MP4 preservation: passed
          - Offline account, upload, callback, and cancellation checks: passed
          - Windows UI and dormant Drive checks: passed
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Upload Release build
        if: github.event_name != 'schedule'
        uses: actions/upload-artifact@v7
        with:
          name: CaptureCanva-release-build-${{ github.sha }}
          path: src/CaptureCanva/bin/Release/net10.0-windows10.0.22621.0/
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        id: dotnet
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet cache
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-${{ runner.arch }}-nuget-v1-${{ steps.dotnet.outputs.dotnet-version }}-${{ hashFiles('**/*.csproj', '**/NuGet.Config', '**/nuget.config', 'global.json') }}

      - name: Publish self-contained single file
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          dotnet publish $env:PROJECT -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none `
            -p:Version=$version -o publish
          if ($LASTEXITCODE -ne 0) { throw 'dotnet publish failed.' }

      - name: Cache FFmpeg
        uses: actions/cache@v6
        with:
          path: ${{ env.FFMPEG_CACHE_DIRECTORY }}
          key: ${{ runner.os }}-${{ runner.arch }}-ffmpeg-v1-${{ hashFiles('scripts/Bundle-Ffmpeg.ps1') }}

      - name: Bundle and verify FFmpeg
        shell: pwsh
        run: ./scripts/Bundle-Ffmpeg.ps1 -OutputDirectory publish -CacheDirectory $env:FFMPEG_CACHE_DIRECTORY

      - name: Package portable application
        shell: pwsh
        run: |
          Compress-Archive -Path publish/* -DestinationPath "CaptureCanva-${{ github.ref_name }}-win-x64.zip"

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          ## CaptureCanva ${{ github.ref_name }}

          Windows 10/11 x64 screen recorder (full screen, window, region). Self-contained: no .NET install needed.

          **Ready to use**: extract the ZIP and run ``CaptureCanva.exe``. FFmpeg is included; no installation or PATH setup is needed.

          **MP4 + GIF**: completed recordings also produce a web-ready GIF by default. Choose report/blog/high-quality/original-size presets, or turn GIF output off. Cancelling GIF conversion keeps the saved MP4.

          **Preferences and hotkeys**: configure and save recording/pause shortcuts in Preferences. Conflicting registrations or failed saves restore the previous shortcuts.

          **YouTube upload (experimental)**: connect an account in Preferences, then upload completed MP4 recordings with transferred-byte progress, cancellation and clickable result links. Uploads default to private; local MP4 and GIF files are preserved on failure or cancellation. Google Drive code remains dormant and its UI is hidden.

          **Google setup and verification**: provide a desktop-app OAuth client as ``google-oauth-client.json`` beside the executable or in ``%APPDATA%\CaptureCanva``, and enable YouTube Data API v3 for that project. Client credentials and account tokens are not bundled. Offline HTTP, loopback OAuth callbacks and Windows UI are tested; actual Google login, refresh and upload still require verification with a configured client. Recording and GIF conversion work without Google configuration.

          **MAZELINE**: the footer banner opens https://www.mazeline.tech/ in your default browser. Recording settings scroll when needed to keep the banner visible on smaller screens.

          The package includes FFmpeg 9.0.2 (GPLv3), its license, build information, and source links in ``licenses/ffmpeg`` and ``THIRD-PARTY-NOTICES.md``.
          "@
          $notesPath = Join-Path $env:RUNNER_TEMP 'capturecanva-release-notes.md'
          [IO.File]::WriteAllText($notesPath, $notes, [Text.UTF8Encoding]::new($false))
          $prereleaseArgs = @()
          if ('${{ github.ref_name }}'.Contains('-')) { $prereleaseArgs += '--prerelease' }
          gh release create '${{ github.ref_name }}' "CaptureCanva-${{ github.ref_name }}-win-x64.zip" `
            --title "CaptureCanva ${{ github.ref_name }}" --notes-file $notesPath @prereleaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
